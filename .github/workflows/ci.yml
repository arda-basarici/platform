# Credential-free checks only. Nothing here can reach a backend, a provider
# API, or a host: a `plan` needs a read identity over state and providers and
# its output leaks values into a public pull request, so plan and apply stay
# laptop-side (DESIGN, "Decisions that changed, and why") until that identity is designed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # the whole job runs in about two minutes; a hang is a defect, not a wait
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not the diff

      # Secrets: the pre-commit hook only runs where hooksPath was set, so CI is
      # the gate that cannot be skipped. A secret pushed past a hook is still in
      # the commits behind it, hence the full history.
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_ENABLE_SUMMARY: "false"
          # On a pull_request event the action calls the GitHub API to list the
          # PR's commits before scanning them; without a token it stops with
          # "GITHUB_TOKEN is now required to scan pull requests". This is the
          # per-run token GitHub mints for the job, scoped by the `permissions`
          # block above (contents: read) — nothing to store or rotate. Found on
          # the repo's first PR (Dependabot, 2026-08-30): push runs never needed it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Terraform line the laptop applies with; the lock files pin providers.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.15"
          # The action's default wrapper script captures output for later
          # steps and does not pass stdin through; `terraform console` below
          # reads its expression from stdin and hung for good behind it
          # (first run of that step, 2026-08-30). Nothing here uses the outputs.
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      # One init + validate per stack, without a backend: the syntax and the
      # provider schemas are checked, the state is never touched. `-lockfile=
      # readonly` fails if a stack's lock file no longer matches its constraints,
      # so a provider bump is always a deliberate commit. A lock file records one
      # `h1:` package hash per platform it was initialized on, so a new stack's
      # lock needs `terraform providers lock -platform=windows_amd64
      # -platform=linux_amd64` on the laptop before this runner can init it
      # (first run, 2026-08-27, failed on a Windows-only lock).
      # The shell that runs as root on the box (firewall.sh), as the login user
      # on a timer (backup.sh), and as the acceptance test (verify.sh). The
      # image is pinned by digest, like the actions by SHA. `-S style` is the
      # strictest level: a finding is fixed or annotated in place with its why,
      # never silenced globally.
      - name: shellcheck (the scripts a host runs)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo             koalaman/shellcheck@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb             -S style box/firewall.sh projects/steamlens/backup.sh ansible/verify.sh

      # cloud-init is a Terraform template; `validate` checks the HCL around it,
      # not the shell inside it. Render it with the real renderer (`templatefile`
      # through `terraform console`) on placeholder values, then shellcheck the
      # result. Console insists on an initialized backend, so the stack is copied
      # without `backend.tf` first. The two names match the `templatefile` call
      # in instance.tf; a third variable there fails this step at render time.
      - name: shellcheck (cloud-init, rendered)
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp terraform/stacks/leave-impact-prod/*.tf terraform/stacks/leave-impact-prod/*.tftpl              terraform/stacks/leave-impact-prod/.terraform.lock.hcl "$tmp"/
          rm "$tmp/backend.tf"
          terraform -chdir="$tmp" init -backend=false -lockfile=readonly -input=false >/dev/null
          echo 'templatefile("user_data.sh.tftpl", {app_hostname="probe.example", cloudflare_ipv4_ranges=["192.0.2.0/24"]})'             | terraform -chdir="$tmp" console | sed '1d;$d' > "$tmp/user_data.rendered.sh"
          grep -q 'probe.example {' "$tmp/user_data.rendered.sh"   # the render saw our input, not a default
          docker run --rm -v "$tmp:/r"             koalaman/shellcheck@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb             -S style /r/user_data.rendered.sh

      # The play, parsed: YAML, role structure, every module name resolved
      # against the installed collections (a misspelled module fails here,
      # exit 4). Versions match the WSL control node that proved the play on a
      # blank host (2026-08-28). No host is contacted; the example inventory
      # only gives the parser hosts to bind to.
      - name: ansible-playbook --syntax-check
        run: |
          set -euo pipefail
          pip install --quiet ansible-core==2.20.1
          ansible-galaxy collection install community.general:==12.1.0 community.docker:==5.0.4
          ANSIBLE_CONFIG="$PWD/ansible/ansible.cfg" ansible-playbook --syntax-check             -i ansible/inventory/example.yml ansible/site.yml

      - name: terraform validate (every stack)
        run: |
          set -euo pipefail
          for stack in terraform/stacks/*/; do
            echo "::group::$stack"
            terraform -chdir="$stack" init -backend=false -lockfile=readonly -input=false
            terraform -chdir="$stack" validate
            echo "::endgroup::"
          done
