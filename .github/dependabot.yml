# Pins move by pull request, never by aging. Actions are pinned by commit SHA in
# ci.yml (a tag can be re-pointed; a SHA cannot), so a bump here is the only way
# they change. A provider bump rewrites a stack's lock file; Dependabot keeps
# every platform hash the lock already had (the first bump, aws 6.62.0 on
# 2026-08-30, passed ci's `-lockfile=readonly` untouched), so the Linux-only
# lock trap ci.yml records is a laptop `init -upgrade` hazard, not this path's.
# A provider bump is merged only after a zero-diff plan on the laptop with it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: terraform
    directory: /terraform/stacks/edge
    schedule:
      interval: monthly
  - package-ecosystem: terraform
    directory: /terraform/stacks/leave-impact-prod
    schedule:
      interval: monthly
