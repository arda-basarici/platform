# The box, transcribed from box/README.md. One play, the roles in a FIXED order
# because each depends on the one before (DESIGN, "The playbook's rulings"):
#   hardening -> docker -> firewall (needs Docker's chains) -> proxy -> backups.
# A failure names its section.
- name: The box
  hosts: all
  become: true
  roles:
    - hardening
    - docker
    - firewall
    - proxy
    - backups
