# projects/steamlens/README.md "Backups", the platform's side: the two tools,
# the tenant's runtime directory, the units from the checkout, the timer.
# The secret (backup.env) is pushed out-of-band per SECRETS.md and the units
# tolerate its absence; the Drive OAuth is manual and only verified here. The
# monthly restore check (restore-check.sh, its service and timer) rides the
# same loops: same user, same env file, same remote.

- name: Install sqlite3 and rclone
  ansible.builtin.apt:
    name:
      - sqlite3
      - rclone
    state: present
    update_cache: true
    cache_valid_time: 3600

# Owned by the login user so later secret pushes need no sudo (a piped ssh
# has no tty to ask on).
- name: Create the tenant's runtime directory
  ansible.builtin.file:
    path: /etc/platform/steamlens
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0750"

- name: Make the tenant's scripts executable
  ansible.builtin.file:
    path: "/srv/platform/projects/steamlens/{{ item }}"
    mode: "0755"
  loop:
    - backup.sh
    - restore-check.sh

# root-owned, as every unit the play installs (roles/firewall says why).
- name: Install the backup units from the checkout
  ansible.builtin.copy:
    remote_src: true
    src: "/srv/platform/projects/steamlens/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - steamlens-backup.service
    - steamlens-backup.timer
    - steamlens-restore-check.service
    - steamlens-restore-check.timer
  notify: Reload systemd

# The unit in the checkout names the box's login user; the login user of any
# other host is the inventory's, so the play sets it in a drop-in it owns —
# the same shape the firewall role uses for the uplink name. Written on every
# host, the box included: the effective value is then always the inventory's,
# never "whatever the checkout says", and verify.sh reads it back.
- name: Own the drop-in directories for the tenant's services
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    mode: "0755"
  loop: "{{ backups_steamlens_services }}"

- name: Run the tenant's services as the inventory's login user
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}.d/user.conf"
    content: |
      # Written by the platform play (roles/backups); the login user from the inventory.
      [Service]
      User={{ ansible_user }}
    mode: "0644"
  loop: "{{ backups_steamlens_services }}"
  notify: Reload systemd

- name: Reload systemd before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable the nightly backup and the monthly restore-check timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - steamlens-backup.timer
    - steamlens-restore-check.timer

# A read, so it runs in check mode too (roles/firewall's chain read says why).
- name: Look for the rclone remote "gdrive" as the login user
  ansible.builtin.command: rclone listremotes
  become_user: "{{ ansible_user }}"
  register: rclone_remotes
  changed_when: false
  check_mode: false

- name: Fail when the remote is missing (the box)
  ansible.builtin.fail:
    msg: >-
      rclone remote "gdrive:" is not configured for {{ ansible_user }}; the Drive
      OAuth is a manual step, see projects/steamlens/README.md, "One-time setup".
  when: backups_require_remote and 'gdrive:' not in rclone_remotes.stdout_lines

- name: Warn when the remote is missing (a test host)
  ansible.builtin.debug:
    msg: >-
      rclone remote "gdrive:" is not configured; backups_require_remote is false,
      so this host is treated as a test host and the timer will fail until it is.
  when: not backups_require_remote and 'gdrive:' not in rclone_remotes.stdout_lines
