# Ansible reads this file only when the directory is not world-writable. Under
# WSL every /mnt/c path IS world-writable, so it is silently ignored there —
# run with it named explicitly:
#   ANSIBLE_CONFIG=/mnt/c/Users/ardab/Desktop/projects/platform/ansible/ansible.cfg ansible-playbook site.yml
# (an absolute path: $PWD does not survive the PowerShell -> wsl -> bash hop).
[defaults]
inventory = inventory/local.yml
roles_path = roles
interpreter_python = /usr/bin/python3
retry_files_enabled = false
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = true
